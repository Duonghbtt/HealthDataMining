config_refs:
  data: configs/data.yaml
  model: configs/model.yaml
  train: configs/train.yaml

paths:
  ddi_matrix_path: data/processed/ddi/drug_ddi.pt
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  report_dir: outputs/reports
  prediction_dir: outputs/predictions

runtime:
  mode: core
  device: cuda
  batch_size: 32

loss:
  lambda_ddi: 0.05

prediction:
  threshold: null

run:
  smoke_test: false
  max_eval_batches: null

evaluation:
  split: test
  save_predictions: true
  save_reports: true
  subgroup_analysis: true

threshold_search:
  enabled: true
  selection_metric: jaccard
  methods:
    - global
    - topk
    - percentile
  global_thresholds:
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
  topk_values:
    - 5
    - 10
    - 15
    - 20
  percentile_values:
    - 85
    - 90
    - 95
    - 97
  prefer_lower_ddi_as_tiebreaker: true

report:
  save_threshold_comparison: true
  save_tradeoff_curve_data: true

calibration:
  enabled: false

core:
  mode: core
  use_retrieval: false
  use_group_encoder: false

extended:
  mode: extended
  use_retrieval: false
  use_group_encoder: true
  retrieval_top_k: 5
  temporal_decay_alpha: 0.05
  retrieval_backend: bruteforce
  use_faiss_if_available: true
  allow_cross_split: false
