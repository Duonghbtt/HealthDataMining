config_refs:
  data: configs/data.yaml
  model: configs/model.yaml
  train: configs/train.yaml

paths:
  processed_root: data/processed
  vocab_root: data/interim/vocab
  ddi_matrix_path: data/processed/ddi/drug_ddi.pt
  checkpoint_dir: outputs/checkpoints
  report_dir: outputs/reports
  prediction_dir: outputs/predictions

runtime:
  # The shipped evaluators are core-only and intentionally disable retrieval.
  mode: core
  device: cuda
  batch_size: 32

prediction:
  mode: threshold
  top_k: 10
  top_k_strategy: fixed
  decoder_top_k: 10
  # Fallback only. Evaluators prefer CLI --threshold, then checkpoint threshold metadata.
  threshold: 0.5
  calibration:
    enabled: false
    split: val
    metric: f1
    tie_breaker: jaccard
    candidates: [0.5]

evaluation:
  split: test
  save_predictions: true
  save_reports: true

core:
  use_retrieval: false
  use_group_encoder: false
