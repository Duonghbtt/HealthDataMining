seed: 17

paths:
  raw_root: data/raw
  interim_root: data/interim
  processed_root: data/processed
  ddi_source_path: data/raw/ddi/drug_ddi_smoke.csv

processed_format: parquet

split:
  train: 0.7
  val: 0.15
  test: 0.15

cohort:
  require_diagnosis: true
  require_medication: true
  min_los_hours: 0.0

features:
  time_bucket_hours: 24
  top_k_labs: 64
  top_k_vitals: 64
  max_med_history: 32
  max_visits: null
  max_history: null
  normalization_eps: 1.0e-6

spark:
  enabled: true
  master: local[4]
  driver_memory: 4g
  default_parallelism: 4
  sql_shuffle_partitions: 8
  adaptive_enabled: true
  adaptive_coalesce_enabled: true
  files_max_partition_bytes: 64m
  local_dir: /tmp/healthdm-spark
  stage_cache_dir: data/interim/spark_cache
  cache_codec: snappy
  trajectory_rows_per_file: 8192
  max_open_shards_per_dataset: 4

profiles:
  safe:
    features:
      max_visits: null
      max_history: null
    spark:
      max_open_shards_per_dataset: 4
  balanced:
    features:
      max_visits: null
      max_history: null
    spark:
      max_open_shards_per_dataset: 4
  fast:
    features:
      max_visits: 16
      max_history: 24
    spark:
      max_open_shards_per_dataset: 6
