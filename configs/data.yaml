seed: 17

ddi_representation: med_vocab_main

paths:
  # Use repo-relative paths for Windows-friendly local runs.

  # MIMIC-IV input paths
  raw_root: data/raw  # Extracted MIMIC-IV root used by load_mimic.py
  mimic_prescriptions_path: data/raw/hosp/prescriptions.csv.gz  # Explicit prescriptions table for medication normalization

  # RxNorm release input paths
  rxnorm_root: data/processed/ddi/RxNorm_full_04062026  # Extracted RxNorm release root containing RRF files

  # DrugBank vocabulary input paths
  drugbank_vocab_path: data/processed/ddi/drugbank vocabulary.csv  # DrugBank vocabulary CSV used for alias normalization

  # DDInter input paths
  ddinter_root: data/processed/ddi  # Directory containing DDInter CSV shards
  ddinter_glob: ddinter_downloads_code_*.csv  # Glob for DDInter interaction pair files

  # Output artifact paths
  interim_root: data/interim  # Shared interim root for cohort, vocab, and trajectory artifacts
  cohort_root: data/interim/cohort  # Cohort CSV and split manifests
  trajectory_interim_root: data/interim/trajectories  # Interim trajectory staging area
  vocab_root: data/interim/vocab  # Diagnosis, procedure, and drug vocab artifacts
  processed_root: data/processed  # Processed benchmark outputs root
  ddi_root: data/processed/ddi  # Final DDI tensor and DDI report outputs
  artifacts_root: data/artifacts  # Shared training/runtime artifacts
  encoder_artifact_root: data/artifacts/encoder  # Encoder-side derived artifacts

# RxNorm cache controls
rxnorm_use_cache: true  # Reuse cached RxNorm minimal index when source RRF files are unchanged
rxnorm_force_rebuild: false  # Ignore cache and rebuild RxNorm minimal index from source files
rxnorm_cache_dir: data/processed/ddi/RxNorm_full_04062026/cache  # Persistent pickle cache for the RxNorm minimal index

ddinter_include_unknown: false

split:
  train: 0.7
  val: 0.15
  test: 0.15

cohort:
  require_diagnosis: true
  require_medication: true
  min_los_hours: 0.0

features:
  time_bucket_hours: 24
  top_k_labs: 64
  top_k_vitals: 64
  max_med_history: 32
  normalization_eps: 1.0e-6

spark:
  enabled: true
  master: local[2]
  driver_memory: 8g
  default_parallelism: 2
  sql_shuffle_partitions: 4
  adaptive_enabled: true
  adaptive_coalesce_enabled: true
  files_max_partition_bytes: 64m
  local_dir: data/interim/spark_tmp
  stage_cache_dir: data/interim/spark_cache
  cache_codec: snappy
  trajectory_rows_per_file: 8192
  max_open_shards_per_dataset: 8
