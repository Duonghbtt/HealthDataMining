config_refs:
  data: configs/data.yaml
  model: configs/model.yaml

paths:
  processed_root: data/processed
  vocab_root: data/interim/vocab
  ddi_matrix_path: data/processed/ddi/drug_ddi.pt
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs

runtime:
  mode: core
  profile: balanced
  device: cuda
  batch_size: 16
  num_workers: 4
  pin_memory: true
  amp: true
  grad_accum_steps: 2
  non_blocking_transfer: true
  persistent_workers: true
  prefetch_factor: 2
  log_interval: 100
  profile_steps: null
  train_decoder_top_k: 0
  matmul_precision: high
  length_bucket_window: 256

optimization:
  epochs: 10
  learning_rate: 1.0e-3
  optimizer: adam
  scheduler: none

loss:
  ddi_lambda: 0.05

prediction:
  top_k: 10
  threshold: 0.5

core:
  mode: core
  use_retrieval: false
  use_group_encoder: false

extended:
  mode: extended
  use_retrieval: true
  use_group_encoder: true
  retrieval_top_k: 5
  temporal_decay_alpha: 0.05
  retrieval_backend: bruteforce
  use_faiss_if_available: true
  allow_cross_split: false

profiles:
  safe:
    runtime:
      batch_size: 8
      num_workers: 2
      pin_memory: true
      amp: true
      grad_accum_steps: 2
      non_blocking_transfer: true
      persistent_workers: true
      prefetch_factor: 2
      log_interval: 50
      profile_steps: null
      train_decoder_top_k: 0
      matmul_precision: high
      length_bucket_window: 128
  balanced:
    runtime:
      batch_size: 16
      num_workers: 4
      pin_memory: true
      amp: true
      grad_accum_steps: 2
      non_blocking_transfer: true
      persistent_workers: true
      prefetch_factor: 2
      log_interval: 100
      profile_steps: null
      train_decoder_top_k: 0
      matmul_precision: high
      length_bucket_window: 256
  fast:
    runtime:
      batch_size: 32
      num_workers: 4
      pin_memory: true
      amp: true
      grad_accum_steps: 1
      non_blocking_transfer: true
      persistent_workers: true
      prefetch_factor: 2
      log_interval: 100
      profile_steps: 100
      train_decoder_top_k: 0
      matmul_precision: high
      length_bucket_window: 256
