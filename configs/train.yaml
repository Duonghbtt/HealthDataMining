config_refs:
  data: configs/data.yaml
  model: configs/model.yaml

paths:
  ddi_matrix_path: data/processed/ddi/drug_ddi.pt
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  report_dir: outputs/reports

runtime:
  mode: core
  device: cuda
  batch_size: 32
  num_workers: 4
  train_num_workers: 4
  val_num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2

optimization:
  epochs: 14
  learning_rate: 3.0e-4
  max_grad_norm: 0.5
  sanitize_code_embedding_grads: true
  code_embedding_grad_max_norm: 0.25
  freeze_code_embedding_epochs: 2
  optimizer: adam
  scheduler: none

debug_checks:
  enabled: false
  light_mode: true
  check_every_n_steps: 100
  sync_timing: false

loss:
  use_bce: true
  use_margin_loss: false
  margin_weight: 0.0
  use_ddi: true
  lambda_ddi: 5.0e-5
  stage_training: true
  ddi_schedule:
    enabled: true
    type: linear
    start_epoch: 9
    end_epoch: 14
    start_value: 0.0
    end_value: 5.0e-5

decoder:
  mode: legacy
  type: residual_mlp
  hidden_multiplier: 2
  dropout: 0.1
  layer_norm: true
  activation: relu
  gate_type: scalar
  use_history_copy: true
  use_retrieval_copy: true
  use_memory_copy: false
  copy_projection: none
  gate_hidden_dim: 128

training:
  stage1_epochs: 8
  stage2_epochs: 6
  selection_metric: jaccard

logging:
  save_loss_components: true

run:
  smoke_test: false
  max_train_batches: null
  max_val_batches: null
  max_eval_batches: null

prediction:
  top_k: null
  threshold: 0.3

core:
  mode: core
  use_retrieval: true
  use_group_encoder: false

extended:
  mode: extended
  use_retrieval: true
  use_group_encoder: false
  retrieval_top_k: 3
  temporal_decay_alpha: 0.05
  retrieval_backend: faiss
  use_faiss_if_available: true
  allow_cross_split: false

retrieval_cache:
  enabled: true
  cache_root: data/artifacts/retrieval_cache
  top_k: 3
  use_precomputed: true
  build_if_missing: false
  memory_split_for_eval: train
  allow_cross_split: false
  allow_same_patient: false
  backend: faiss