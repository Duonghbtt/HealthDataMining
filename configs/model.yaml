model:
  hidden_dim: 128
  num_layers: 1
  dropout: 0.1

embedding:
  diag_dim: 128
  proc_dim: 128
  drug_dim: 128
  lab_dim: 64
  vital_dim: 64
  time_dim: 32

encoder:
  mode: modality_aware_gru
  modality_hidden_dim: 128
  fusion_hidden_dim: 128
  modality_dropout: 0.1
  use_temporal_attention: true
  temporal_attention_heads: 1
  temporal_attention_dropout: 0.1

sequence:
  rnn_type: gru
  bidirectional: false

retrieval:
  enabled: false
  mode: bruteforce
  top_k: 5
  temporal_decay_alpha: 0.05
  exclude_same_stay: true
  backend: bruteforce
  use_faiss_if_available: true
  graph_top_k: 5
  allow_same_patient: false
  exclude_future: true
  exclude_exact_match: true
  exclude_future_same_patient: true
  exclude_future_all_patients_if_absolute_time: true
  require_absolute_time_for_cross_patient_temporal_filter: false
  similarity_mode: cosine_decay
  use_time_gap: true
  dropout: 0.1

full_model:
  history_mode: self_only

debug:
  return_retrieval_aux: false

training:
  device: cuda

history_selector:
  enabled: true
  mode: visit_attribute
  dropout: 0.1
  top_k: 3
  score_bias_weight: 0.5
  self_top_k: 3
  attention_type: softmax_topk
  return_attention_weights: true
  save_selected_indices: true
  neighbor_top_k: 3
  use_retrieval_bias: true

fusion:
  mode: gated
  dropout: 0.1
  strategy: gated

hypergraph:
  num_layers: 2
  dropout: 0.1
  num_group_prototypes: 8
  use_semantic_edges: true
  use_weighted_edges: true
  prototype_top_k: 2
