model:
  hidden_dim: 128
  num_layers: 1
  dropout: 0.1

embedding:
  diag_dim: 128
  proc_dim: 128
  drug_dim: 128
  lab_dim: 64
  vital_dim: 64
  time_dim: 32

sequence:
  rnn_type: gru
  bidirectional: false

# Experimental extension only.
# train_core.py and the default evaluators do not read this block.
retrieval:
  top_k: 5
  temporal_decay_alpha: 0.05
  backend: bruteforce
  use_faiss_if_available: true
  scoring_mode: temporal_relevance
  cross_split_policy: same_split

history_selector:
  dropout: 0.1
  score_bias_weight: 0.5
  self_top_k: 3
  # Neighbor history only becomes active inside the experimental retrieval path.
  neighbor_top_k: 3
  use_retrieval_bias: true

fusion:
  dropout: 0.1
  strategy: gated
  current_branch_dropout: 0.0

decoder:
  # Optional research path for PRAUC-oriented structured label modeling.
  # Disabled by default so existing benchmark configs remain comparable.
  mode: independent
  label_correlation:
    enabled: false
    correlation_dim: 64
    patient_residual_weight: 0.10
    coprescription_residual_weight: 0.05
    dropout: 0.1

# Experimental extension only. Not part of the verified core path.
hypergraph:
  num_layers: 2
  dropout: 0.1
  num_group_prototypes: 8
  use_semantic_edges: true
  use_weighted_edges: true
  prototype_top_k: 2

profiles:
  safe:
    model:
      hidden_dim: 128
      num_layers: 1
      dropout: 0.1
    embedding:
      diag_dim: 128
      proc_dim: 128
      drug_dim: 128
      lab_dim: 64
      vital_dim: 64
      time_dim: 32
    history_selector:
      self_top_k: 3
  balanced:
    model:
      hidden_dim: 128
      num_layers: 1
      dropout: 0.1
    embedding:
      diag_dim: 128
      proc_dim: 128
      drug_dim: 128
      lab_dim: 64
      vital_dim: 64
      time_dim: 32
    history_selector:
      self_top_k: 3
  fast:
    model:
      hidden_dim: 96
      num_layers: 1
      dropout: 0.1
    embedding:
      diag_dim: 96
      proc_dim: 96
      drug_dim: 96
      lab_dim: 48
      vital_dim: 48
      time_dim: 16
    history_selector:
      self_top_k: 2
