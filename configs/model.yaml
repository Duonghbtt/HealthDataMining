model:
  hidden_dim: 128
  num_layers: 1
  dropout: 0.1

embedding:
  diag_dim: 128
  proc_dim: 128
  drug_dim: 128
  lab_dim: 64
  vital_dim: 64

sequence:
  rnn_type: gru
  bidirectional: false

retrieval:
  top_k: 5
  temporal_decay_alpha: 0.05
  exclude_same_stay: true
  backend: bruteforce
  use_faiss_if_available: true
  graph_top_k: 5

training:
  device: cuda
