config_refs:
  data: ../data.yaml
  model: ../model.yaml

model_overrides:
  fusion:
    current_branch_dropout: 0.15

paths:
  processed_root: ../../data/processed
  vocab_root: ../../data/interim/vocab
  ddi_matrix_path: ../../data/processed/ddi/drug_ddi.pt
  checkpoint_dir: ../../outputs/benchmarks/extended_retrieval_temporal_fusion_posweight_safe/checkpoints
  log_dir: ../../outputs/benchmarks/extended_retrieval_temporal_fusion_posweight_safe/logs

runtime:
  mode: extended
  profile: safe
  device: cuda
  batch_size: 8
  num_workers: 2
  pin_memory: true
  amp: true
  grad_accum_steps: 2
  non_blocking_transfer: true
  persistent_workers: false
  prefetch_factor: 2
  log_interval: 50
  profile_steps: null
  train_decoder_top_k: 0
  matmul_precision: high
  length_bucket_window: 128
  train_budget_label: extended_retrieval_temporal_fusion_posweight_safe

initialization:
  warm_start_checkpoint: ../../outputs/checkpoints/train_core_best.pt
  warm_start_mode: model_only
  strict: true

optimization:
  epochs: 5
  learning_rate: 1.0e-4
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 1
  scheduler_min_lr: 1.0e-6
  early_stopping_patience: 2
  max_grad_norm: 1.0

loss:
  ddi_lambda: 0.05
  objective: bce
  focal_gamma: 1.5
  pos_weight_mode: log_balanced
  pos_weight_clip: 12.0
  fusion_entropy_lambda: 0.01
  fusion_balance_lambda: 0.01
  ddi_lambda_candidates: [0.0, 0.03, 0.05, 0.07]

threshold_tuning:
  enabled: true
  metric: f1
  tie_breaker: jaccard
  split: val
  candidates: [0.18, 0.20, 0.22, 0.24, 0.25, 0.26, 0.28, 0.30, 0.32, 0.35, 0.40, 0.45, 0.50]

prediction:
  top_k: 10
  threshold: 0.5

core:
  use_retrieval: false
  use_group_encoder: false

extended:
  mode: extended
  use_retrieval: true
  use_group_encoder: false
  retrieval_top_k: 5
  temporal_decay_alpha: 0.05
  retrieval_backend: bruteforce
  use_faiss_if_available: true
  allow_cross_split: false
  retrieval_scoring_mode: temporal_relevance
  cross_split_policy: train_bank_only
  validation_memory_bank_policy: train_only
  monitor_metric: val_prauc_tuned
  monitor_mode: max
