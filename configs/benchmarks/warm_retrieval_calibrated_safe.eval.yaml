config_refs:
  data: ../data.yaml
  model: ../model.yaml
  train: warm_retrieval_calibrated_safe.yaml

paths:
  processed_root: ../../data/processed
  vocab_root: ../../data/interim/vocab
  ddi_matrix_path: ../../data/processed/ddi/drug_ddi.pt
  checkpoint_dir: ../../outputs/benchmarks/warm_retrieval_calibrated_safe/checkpoints
  report_dir: ../../outputs/benchmarks/warm_retrieval_calibrated_safe/reports
  prediction_dir: ../../outputs/benchmarks/warm_retrieval_calibrated_safe/predictions

runtime:
  mode: core
  device: cuda
  batch_size: 32

prediction:
  mode: threshold
  top_k: 10
  top_k_strategy: fixed
  decoder_top_k: 10
  threshold: 0.5
  calibration:
    enabled: true
    split: val
    metric: f1
    tie_breaker: jaccard
    candidates: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]

evaluation:
  split: test
  save_predictions: true
  save_reports: true

core:
  use_retrieval: true
  use_group_encoder: false

hypergraph:
  enabled: false

counterfactual:
  enabled: false
