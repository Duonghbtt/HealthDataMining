config_refs:
  data: ../data.yaml
  model: ../model.yaml

model_overrides:
  decoder:
    mode: label_correlation_residual
    label_correlation:
      enabled: true
      correlation_dim: 64
      patient_residual_weight: 0.10
      coprescription_residual_weight: 0.05
      dropout: 0.1

paths:
  processed_root: ../../data/processed
  vocab_root: ../../data/interim/vocab
  ddi_matrix_path: ../../data/processed/ddi/drug_ddi.pt
  checkpoint_dir: ../../outputs/benchmarks/warm_labelcorr_calibrated_safe/checkpoints
  log_dir: ../../outputs/benchmarks/warm_labelcorr_calibrated_safe/logs

runtime:
  mode: core
  profile: balanced
  device: cuda
  batch_size: 16
  num_workers: 2
  pin_memory: true
  amp: true
  grad_accum_steps: 2
  non_blocking_transfer: true
  persistent_workers: false
  prefetch_factor: 2
  log_interval: 100
  profile_steps: null
  train_decoder_top_k: 0
  matmul_precision: high
  length_bucket_window: 256
  train_budget_label: warm_labelcorr_calibrated_safe

initialization:
  warm_start_checkpoint: ../../outputs/checkpoints/train_core_best.pt
  warm_start_mode: model_only
  strict: false

optimization:
  epochs: 5
  learning_rate: 1.0e-4
  optimizer: adam
  scheduler: reduce_on_plateau
  scheduler_factor: 0.5
  scheduler_patience: 1
  scheduler_min_lr: 1.0e-6
  early_stopping_patience: 2
  max_grad_norm: 1.0
  monitor_metric: val_prauc_tuned
  monitor_mode: max

loss:
  ddi_lambda: 0.05
  objective: asymmetric_focal
  focal_gamma: 1.5
  asymmetric_gamma_pos: 0.0
  asymmetric_gamma_neg: 4.0
  asymmetric_clip: 0.05
  pos_weight_mode: log_balanced
  pos_weight_clip: 8.0
  fusion_entropy_lambda: 0.0
  fusion_balance_lambda: 0.0
  ranking_lambda: 0.0
  ranking_objective: bpr
  ranking_margin: 1.0
  ranking_num_negatives: 32
  ranking_hard_negative_fraction: 0.5
  ddi_lambda_candidates: [0.0, 0.05, 0.01]

threshold_tuning:
  enabled: true
  metric: f1
  tie_breaker: jaccard
  split: val
  candidates: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]

prediction:
  top_k: 10
  threshold: 0.5

core:
  use_retrieval: false
  use_group_encoder: false
